name: Terraform State Bootstrap

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-state-bootstrap
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "381549359906"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform-state:
    name: Bootstrap Terraform State
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bootstrap/terraform-state

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.1.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::381549359906:role/GitHubActionsTerraformRole
          aws-region: us-east-1
          allowed-account-ids: 381549359906

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Verify Terraform version
        run: |
          terraform version
          test -f .terraform-version -eq "$(terraform version -json | jq -r '.terraform_version')" = "1.15.8"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify AWS region
        run: aws configure get region

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -upgrade=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Verify primary state bucket
        run: |
          aws s3api head-bucket \
            --bucket leaserack-enterprise-aws-platform-tfstate-381549359906 \
            --region us-east-1

      - name: Verify primary bucket versioning
        run: |
          aws s3api get-bucket-versioning \
            --bucket leaserack-enterprise-aws-platform-tfstate-381549359906 \
            --region us-east-1

      - name: Verify primary bucket encryption
        run: |
          aws s3api get-bucket-encryption \
            --bucket leaserack-enterprise-aws-platform-tfstate-381549359906 \
            --region us-east-1

      - name: Verify secondary state bucket
        run: |
          aws s3api head-bucket \
            --bucket leaserack-enterprise-aws-platform-tfstate-381549359906-dr \
            --region us-west-2