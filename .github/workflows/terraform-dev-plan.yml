name: Terraform DEV Apply

on:
  push:
    branches:
      - main
    paths:
      - "environments/dev/**"
      - "modules/vpc/**"
      - ".github/workflows/terraform-dev-apply.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "381549359906"

jobs:
  terraform-dev:
    name: DEV OIDC Diagnostic
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.1.0

      - name: GitHub context
        run: |
          echo "Repository    : ${GITHUB_REPOSITORY}"
          echo "Repository ID : ${GITHUB_REPOSITORY_ID}"
          echo "Owner         : ${GITHUB_REPOSITORY_OWNER}"
          echo "Owner ID      : ${GITHUB_REPOSITORY_OWNER_ID}"
          echo "Ref           : ${GITHUB_REF}"
          echo "Branch        : ${GITHUB_REF_NAME}"
          echo "Event         : ${GITHUB_EVENT_NAME}"
          echo "Workflow      : ${GITHUB_WORKFLOW}"
          echo "Workflow ref  : ${GITHUB_WORKFLOW_REF}"
          echo "Actor         : ${GITHUB_ACTOR}"
          echo "Run ID        : ${GITHUB_RUN_ID}"

      - name: Debug GitHub OIDC claims
        uses: github/actions-oidc-debugger@main
        with:
          audience: sts.amazonaws.com

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::381549359906:role/GitHubActionsTerraformRole
          aws-region: us-east-1
          allowed-account-ids: 381549359906

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity
