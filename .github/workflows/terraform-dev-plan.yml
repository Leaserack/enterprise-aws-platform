name: Terraform DEV OIDC Diagnostic

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  oidc-debug:
    name: DEV OIDC Debug
    runs-on: ubuntu-latest

    steps:
      - name: GitHub context
        run: |
          echo "Repository    : ${GITHUB_REPOSITORY}"
          echo "Repository ID : ${GITHUB_REPOSITORY_ID}"
          echo "Owner         : ${GITHUB_REPOSITORY_OWNER}"
          echo "Owner ID      : ${GITHUB_REPOSITORY_OWNER_ID}"
          echo "Ref           : ${GITHUB_REF}"
          echo "Branch        : ${GITHUB_REF_NAME}"
          echo "Event         : ${GITHUB_EVENT_NAME}"
          echo "Workflow      : ${GITHUB_WORKFLOW}"

      - name: Debug GitHub OIDC claims
        uses: github/actions-oidc-debugger@main
        with:
          audience: sts.amazonaws.com
