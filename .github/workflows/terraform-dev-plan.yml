name: Terraform DEV Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - "environments/dev/**"
      - "modules/vpc/**"
      - ".github/workflows/terraform-dev-plan.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "381549359906"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

defaults:
  run:
    shell: bash

jobs:
  terraform-plan:
    name: Terraform DEV Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: GitHub OIDC context
        run: |
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Ref        : $GITHUB_REF"
          echo "Branch     : $GITHUB_REF_NAME"
          echo "Event      : $GITHUB_EVENT_NAME"
          echo "Actor      : $GITHUB_ACTOR"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::381549359906:role/GitHubActionsTerraformRole
          aws-region: us-east-1
          allowed-account-ids: "381549359906"

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Terraform version
        working-directory: environments/dev
        run: |
          terraform version

      - name: Terraform format check
        working-directory: environments/dev
        run: |
          terraform fmt -check -recursive

      - name: Terraform init
        working-directory: environments/dev
        run: |
          terraform init \
            -input=false \
            -reconfigure

      - name: Terraform validate
        working-directory: environments/dev
        run: |
          terraform validate

      - name: Terraform plan
        working-directory: environments/dev
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      - name: Show Terraform plan
        working-directory: environments/dev
        run: |
          terraform show -no-color tfplan
